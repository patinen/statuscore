version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: statuscore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: statuscore_dev
      POSTGRES_USER: statuscore
      POSTGRES_PASSWORD: statuscore_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U statuscore -d statuscore_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: statuscore-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
